services:
  db:
    image: postgres:16-alpine
    container_name: shopping-list-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PUBLIC_PORT:-5432}:5432'
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shopping-list-backend
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      JWT_SECRET: ${JWT_SECRET}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8080}
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: postgres:16-alpine
    container_name: shopping-list-migrate
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: ['sh', '-c', 'psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /schema.sql']
    volumes:
      - ./backend/database/schema.sql:/schema.sql:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: shopping-list-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
